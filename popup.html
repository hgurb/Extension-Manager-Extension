<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Extension Manager Extension</title>
  <link rel="stylesheet" href="manager.css">
  <link rel="stylesheet" href="popup.css">
  <script src="ui.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <nav class="popup-nav" aria-label="Extension pages">
    <div class="manager-header-box">
      <button id="open-manager" class="manager-shortcut" title="Extension Manager Extension"><img src="icons/icon-32.png" width="22" height="22" alt=""><span>Extension Manager Extension ↗</span></button>
      <div id="manager-tools" class="manager-tools" aria-label="Manager controls"></div>
    </div>
    <div class="chrome-shortcuts"><button id="open-chrome" class="shortcut-button" title="Chrome extensions" aria-label="Chrome extensions"></button><button id="open-dashboard" class="shortcut-button" title="Developer dashboard" aria-label="Chrome Web Store developer dashboard"></button></div>
  </nav>
  <p id="popup-empty" hidden>No favorites yet. Star extensions below or choose favorites on the manager page.</p>
  <div id="popup-list" aria-label="Extensions"></div>
  <p id="status" role="status" aria-live="polite"></p>
</body>
</html>
